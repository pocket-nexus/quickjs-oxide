name: Verification support checks

on:
  pull_request:
    paths:
      - 'core/**'
      - 'regexp/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/verification/**'
      - '.github/workflows/verification.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'regexp/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/verification/**'
      - '.github/workflows/verification.yml'
  workflow_dispatch:

permissions:
  contents: read

# Solvers run locally with recorded budgets and receipts. GitHub checks only
# proof-source formatting and the receipt/inventory tooling.
jobs:
  support:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust formatting tools
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Check proof formatting and receipt validation
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2024 --check core/src/*_kani_tests.rs core/src/heap/*_kani_tests.rs
          python3 -m unittest discover -s scripts/verification -p 'test_*.py'
