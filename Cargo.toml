[package]
name = "quickjs-oxide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A safe Rust JavaScript engine targeting semantic parity with QuickJS"
homepage.workspace = true
readme = "README.md"
keywords = ["javascript", "ecmascript", "quickjs", "interpreter", "engine"]
categories = ["compilers", "development-tools"]

[lints]
workspace = true

[dependencies]
num-bigint = { workspace = true }
num-traits = { workspace = true }

[features]
default = []
test262-host = []
test-support = []
profiling = []
# Restores identity checks on trusted handle fast paths in release builds.
checked-handles = []
[dev-dependencies]
quickjs-oxide-host = { workspace = true, features = ["engine-test-support"] }

# Real-main-thread stack-guard matrix; its fn main is the test body so Cargo
# always builds the probe it spawns (no pre-built example artifact required).
[[test]]
name = "main_thread_stack_probe"
harness = false

[workspace]
members = ["adapters/native", "adapters/web", ".", "apps/cli", "apps/web", "conformance/test262"]
default-members = [".", "apps/cli"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/pocket-nexus/quickjs-oxide"
homepage = "https://pocket-nexus.github.io/quickjs-oxide/"
# Releases ship as GitHub Release assets, not crates.io packages.
publish = false

[workspace.dependencies]
quickjs-oxide-web-host = { path = "adapters/web" }
quickjs-oxide-host = { path = "adapters/native" }
quickjs-oxide = { path = ".", default-features = false }
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
tz-rs = "=0.7.3"
js-sys = { version = "=0.3.103", default-features = false }
wasm-bindgen = "=0.2.126"

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Its arm-guard rewrite moves the inner test into the guard, so a false
# test falls through to later arms instead of leaving the arm; several
# sites test with side effects (`delimiters.pop()`).
collapsible_match = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
