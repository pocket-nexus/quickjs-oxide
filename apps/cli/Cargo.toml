[package]
name = "quickjs-oxide-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The qjs command-line interpreter for the quickjs-oxide JavaScript engine"
homepage.workspace = true
readme = "../../README.md"
keywords = ["javascript", "quickjs", "interpreter", "runtime", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[dependencies]
quickjs-oxide-host = { workspace = true }
quickjs-oxide = { workspace = true }

[[bin]]
name = "qjs"
path = "src/main.rs"

# The new core's driver (#122, phase 2): runs a script on oxide-core.
[[bin]]
name = "oxide-run"
path = "src/oxide_run.rs"

[features]
default = []
test262-host = ["quickjs-oxide/test262-host"]
profiling = ["quickjs-oxide/profiling"]
# `oxide-run --gc-stress=N`: the new core's stress collector.
new-core-gc-stress = ["quickjs-oxide/new-core-gc-stress"]
# `oxide-run --ic-stats`: the new core's inline-cache report at exit.
new-core-ic-stats = ["quickjs-oxide/new-core-ic-stats"]

# `cargo binstall` fetches the archives that .github/workflows/release.yml
# attaches to each `v*` GitHub Release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/qjs-v{ version }-{ target }{ archive-suffix }"
bin-dir = "qjs-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dev-dependencies]
quickjs-oxide = { workspace = true, features = ["test-support"] }
